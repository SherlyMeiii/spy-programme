<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Spy Who Came in from the Park — Digital Programme</title>
<meta name="description" content="Digital programme for The Spy Who Came in from the Park, a new original musical. Forest Theatre at Greenside @ George Street, Edinburgh Fringe 2026.">
<meta name="theme-color" content="#241d18">
<meta property="og:title" content="The Spy Who Came in from the Park">
<meta property="og:description" content="A new original musical · Edinburgh Fringe 2026 · Forest Theatre at Greenside @ George Street">
<meta property="og:image" content="img/p01.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="img/p01.jpg">
<style>
:root{
  --ink:#f2e7d5; --ink-dim:#c6b49a;
  --bg:#241d18; --bg2:#1a1512;
  --line:rgba(242,231,213,.16);
  --gold:#d8b06a;
  --paper:#f1e6d3; --paper-head:#93281c; --stitch:#c8836a;
  --bar:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
body{
  color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","PingFang TC","Noto Sans TC",sans-serif;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- top bar ---------- */
#bar{
  position:fixed;top:0;left:0;right:0;height:calc(var(--bar) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:10px;padding-left:8px;padding-right:12px;
  background:linear-gradient(180deg,rgba(26,21,18,.97),rgba(26,21,18,.86));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);z-index:40;
}
#bar .ttl{flex:1;min-width:0;line-height:1.15}
#bar .ttl b{display:block;font-size:14px;font-weight:600;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .ttl small{display:block;font-size:11px;color:var(--ink-dim);letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.iconbtn:active{background:rgba(255,255,255,.09)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- deck ---------- */
#deck{
  position:fixed;inset:calc(var(--bar) + env(safe-area-inset-top)) 0 0 0;
  display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
#deck::-webkit-scrollbar{display:none}
.page{
  flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;
  overflow:hidden;
  padding:12px 12px calc(70px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:9px;
}
/* the artwork gets all the leftover height and is scaled to fit whole —
   never cropped, never covered by anything */
.stage{
  flex:1 1 auto;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center;
}
/* Every page sits in a frame whose width is worked out in JS, so the player bar
   and the tappable areas line up with the artwork at any screen size. */
.frame{
  position:relative;display:flex;flex-direction:column;max-height:100%;
  border-radius:6px;overflow:hidden;background:#2f2620;
  box-shadow:0 10px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
  /* the page fades in as ONE piece — otherwise the player bar, which is plain
     HTML, would paint before the image slices had finished downloading */
  opacity:0;transition:opacity .26s ease;
}
.frame.ready{opacity:1}
.frame img{display:block;width:100%;height:auto}
/* tappable areas laid over the QR codes and contact lines on the last page */
.hot{position:absolute;z-index:4;display:block;border-radius:9px}
.hot::after{
  content:"";position:absolute;inset:0;border-radius:9px;
  border:2px dashed rgba(147,40,28,0);background:rgba(147,40,28,0);transition:.18s;
}
.hot:active::after{border-color:rgba(147,40,28,.7);background:rgba(147,40,28,.10)}
@media (hover:hover){
  .hot{cursor:pointer}
  .hot:hover::after{border-color:rgba(147,40,28,.45);background:rgba(147,40,28,.07)}
}
.zoomhint{
  flex:0 0 auto;margin:0;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-dim);display:flex;align-items:center;gap:6px;text-align:center;
}
.zoomhint svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;flex:none}

/* ---------- player, stitched into the page ---------- */
.audiobar{
  flex:0 0 auto;width:100%;
  display:flex;align-items:center;gap:11px;
  padding:9px 13px;background:var(--paper);
  border-top:2px dashed rgba(200,131,106,.85);
  border-bottom:2px dashed rgba(200,131,106,.85);
}
.playbtn{
  width:42px;height:42px;flex:none;border-radius:50%;background:var(--paper-head);
  display:grid;place-items:center;position:relative;
  box-shadow:0 2px 6px rgba(90,30,20,.28);
}
.playbtn svg{width:15px;height:15px;fill:#f7efe0;margin-left:2px;display:block}
.playbtn.playing svg{margin-left:0}
.playbtn::before{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  border:2px solid rgba(147,40,28,.45);opacity:0;
}
.playbtn.playing::before{animation:ring 1.9s ease-out infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.playbtn:active{transform:scale(.94)}
.abody{flex:1;min-width:0}
.atitle{display:flex;align-items:baseline;gap:7px;min-width:0}
.atitle b{font-size:13px;font-weight:700;color:var(--paper-head);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:Georgia,"Times New Roman",serif}
.atitle small{font-size:10px;color:#8a6a4c;letter-spacing:.11em;text-transform:uppercase;flex:none}
.arow{display:flex;align-items:center;gap:9px;margin-top:3px}
.seek{flex:1;-webkit-appearance:none;appearance:none;height:18px;background:none;margin:0;cursor:pointer}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--paper-head) var(--pct,0%),rgba(147,40,28,.2) var(--pct,0%))}
.seek::-moz-range-track{height:4px;border-radius:2px;background:rgba(147,40,28,.2)}
.seek::-moz-range-progress{height:4px;border-radius:2px;background:var(--paper-head)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--paper-head);margin-top:-4px;box-shadow:0 1px 3px rgba(90,30,20,.45)}
.seek::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--paper-head)}
.atime{font-size:10.5px;color:#8a6a4c;font-variant-numeric:tabular-nums;
  letter-spacing:.03em;flex:none}

/* ---------- bottom nav ---------- */
#foot{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  padding:22px 10px calc(10px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;justify-content:center;
  background:linear-gradient(0deg,rgba(26,21,18,.96) 55%,transparent);
  pointer-events:none;
}
#foot > *{pointer-events:auto}
.navbtn{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(60,48,40,.9);border:1px solid var(--line);
}
.navbtn:disabled{opacity:.28}
.navbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
#dots{
  display:flex;gap:5px;align-items:center;padding:0 12px;height:34px;
  background:rgba(60,48,40,.86);border:1px solid var(--line);border-radius:20px;
}
#dots i{width:5px;height:5px;border-radius:50%;background:rgba(242,231,213,.3);
  transition:.25s;display:block}
#dots i.on{background:var(--gold);width:16px;border-radius:3px}
#dots i.tune{background:rgba(216,176,106,.7)}

/* ---------- TOC ---------- */
#toc{
  position:fixed;inset:0;z-index:60;background:rgba(20,16,13,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
#toc.open{opacity:1;pointer-events:auto}
#toc .panel{
  position:absolute;top:0;left:0;bottom:0;width:min(84vw,340px);
  background:var(--bg2);border-right:1px solid var(--line);
  transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);
}
#toc.open .panel{transform:none}
#toc header{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
#toc header b{display:block;font-size:15px;letter-spacing:.02em}
#toc header small{display:block;margin-top:4px;font-size:11px;color:var(--ink-dim);
  letter-spacing:.08em;text-transform:uppercase}
#toc ol{list-style:none;margin:0;padding:8px 0 30px;overflow-y:auto;flex:1}
#toc li button{
  display:flex;width:100%;gap:12px;align-items:baseline;padding:11px 20px;
  text-align:left;font-size:14.5px;color:var(--ink-dim);
}
#toc li button .num{font-size:11px;width:20px;flex:none;color:rgba(242,231,213,.35);
  font-variant-numeric:tabular-nums}
#toc li button .note{margin-left:auto;flex:none;color:var(--gold);font-size:13px}
#toc li button.on{color:var(--gold)}
#toc li button:active{background:rgba(255,255,255,.06)}

/* ---------- lightbox ---------- */
#lb{
  position:fixed;inset:0;z-index:80;background:#15110e;display:none;
  overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pinch-zoom pan-x pan-y;
}
#lb.open{display:block}
#lb img{display:block;width:100%;max-width:none;margin:0 auto}
#lb.big img{width:230%}
#lbClose{
  position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:82;
  width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.62);
  border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;
}
#lbTip{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:82;
  background:rgba(0,0,0,.66);border:1px solid rgba(255,255,255,.15);
  color:#e8ddcb;font-size:12px;letter-spacing:.05em;padding:8px 16px;border-radius:20px;
}

/* ---------- desktop ---------- */
@media (min-width:820px){
  :root{--bar:70px}
  #bar{padding-left:14px;padding-right:18px}
  #bar .ttl b{font-size:16px}
  .page{padding:18px 20px 84px;gap:12px}
  .atitle b{font-size:14px}
}
@media (hover:hover){
  .stage img{cursor:zoom-in}
  #lb img{cursor:zoom-in}
  #lb.big img{cursor:zoom-out}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div id="bar">
  <button class="iconbtn" id="tocBtn" aria-label="Contents">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="ttl">
    <b>The Spy Who Came in from the Park</b>
    <small id="crumb">Digital Programme</small>
  </div>
</div>

<div id="deck"></div>

<audio id="au" preload="none"></audio>

<div id="foot">
  <button class="navbtn" id="prev" aria-label="Previous page">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div id="dots"></div>
  <button class="navbtn" id="next" aria-label="Next page">
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<div id="toc" aria-hidden="true">
  <div class="panel">
    <header><b>Contents</b><small>Edinburgh Fringe 2026</small></header>
    <ol id="tocList"></ol>
  </div>
</div>

<div id="lb" aria-hidden="true">
  <button id="lbClose" aria-label="Close">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="lbImg" alt="">
  <div id="lbTip">Tap image to zoom · pinch to scale</div>
</div>

<script src="content.js?v=8"></script>
<script>
(function(){
  var P = window.PAGES, N = P.length;
  var PW = 1654, PH = 2339;                 // page pixel size, for exact fitting
  var deck = document.getElementById('deck'),
      dots = document.getElementById('dots'),
      tocList = document.getElementById('tocList'),
      crumb = document.getElementById('crumb'),
      prev = document.getElementById('prev'),
      next = document.getElementById('next'),
      toc = document.getElementById('toc'),
      lb = document.getElementById('lb'),
      lbImg = document.getElementById('lbImg'),
      lbTip = document.getElementById('lbTip');
  var raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window)
                                         : function(f){ return setTimeout(f, 16); };
  var cur = 0, secs = [], frames = [];

  /* ================= audio ================= */
  var au = document.getElementById('au');
  var track = null, seeking = false;
  var PLAY_D = 'M7 4l13 8-13 8z', PAUSE_D = 'M7 4h4v16H7zM13 4h4v16h-4z';
  var bars = [];

  function fmt(s){
    if(!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s/60), r = Math.floor(s%60);
    return m + ':' + (r<10?'0':'') + r;
  }
  function refresh(){
    var on = track && !au.paused && !au.ended;
    bars.forEach(function(b){
      var live = on && b.track === track;
      var p = b.btn.querySelector('svg path');
      if(p) p.setAttribute('d', live ? PAUSE_D : PLAY_D);
      b.btn.classList.toggle('playing', live);
    });
  }
  function paint(el, pct){ el.style.setProperty('--pct', pct.toFixed(1) + '%'); }
  /* Tapping a different song swaps the track. There is only ever one <audio>,
     so the previous song stops on its own; we just wind its bars back to zero. */
  function toggle(t){
    if(track !== t){
      var old = track;
      au.pause();
      track = t;
      if(old){
        bars.forEach(function(b){
          if(b.track !== old) return;
          b.seek.value = 0; paint(b.seek, 0);
          b.time.textContent = '0:00 / ' + old.dur;
        });
      }
      bars.forEach(function(b){
        if(b.track !== t) return;
        b.seek.value = 0; paint(b.seek, 0);
      });
      au.src = (au.canPlayType && au.canPlayType('audio/mp4')) ? t.m4a : t.mp3;
      au.play().catch(function(){});
      refresh();
      return;
    }
    if(au.paused) au.play().catch(function(){}); else au.pause();
  }
  ['play','pause','ended'].forEach(function(e){ au.addEventListener(e, refresh); });
  au.addEventListener('timeupdate', function(){
    var d = au.duration || 0, label = fmt(au.currentTime) + ' / ' + fmt(d);
    bars.forEach(function(b){
      if(b.track !== track) return;
      if(!seeking && d){ var pct = au.currentTime/d; b.seek.value = Math.round(pct*1000); paint(b.seek, pct*100); }
      b.time.textContent = label;
    });
  });
  au.addEventListener('loadedmetadata', function(){
    bars.forEach(function(b){ if(b.track === track) b.time.textContent = '0:00 / ' + fmt(au.duration); });
  });
  au.addEventListener('error', function(){
    bars.forEach(function(b){ if(b.track === track) b.time.textContent = 'unavailable'; });
  });

  function makeBar(a){
    var el = document.createElement('div');
    el.className = 'audiobar';
    el.innerHTML =
      '<button class="playbtn" aria-label="Play ' + a.label + '">' +
        '<svg viewBox="0 0 24 24"><path d="' + PLAY_D + '"/></svg></button>' +
      '<div class="abody">' +
        '<div class="atitle"><b>' + a.label + '</b><small>' + a.sub + '</small></div>' +
        '<div class="arow">' +
          '<input class="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">' +
          '<span class="atime">0:00 / ' + a.dur + '</span>' +
        '</div>' +
      '</div>';
    var btn = el.querySelector('.playbtn'), sk = el.querySelector('.seek'), tm = el.querySelector('.atime');
    btn.addEventListener('click', function(e){ e.stopPropagation(); toggle(a); });
    sk.addEventListener('click', function(e){ e.stopPropagation(); });
    sk.addEventListener('input', function(){ seeking = true; paint(sk, sk.value/10); });
    sk.addEventListener('change', function(){
      if(au.duration) au.currentTime = (sk.value/1000) * au.duration;
      seeking = false;
    });
    bars.push({btn:btn, seek:sk, time:tm, track:a});
    return el;
  }

  /* ================= build pages ================= */
  P.forEach(function(p, i){
    var sec = document.createElement('section');
    sec.className = 'page';
    var pad = String(p.n).padStart(2,'0');

    var stage = document.createElement('div');
    stage.className = 'stage';

    var pending = 0, shown = false;
    function reveal(){ if(!shown && pending <= 0){ shown = true; frame.classList.add('ready'); } }
    function mkImg(base, w, h){
      var im = document.createElement('img');
      im.alt = 'Page ' + p.n + ' — ' + p.title;
      im.decoding = 'async';
      im.width = w; im.height = h;
      im.dataset.src = 'img/' + base + '.webp';
      im.dataset.jpg = 'img/' + base + '.jpg';
      im.dataset.big = 'img/p' + pad + '@2x.webp';
      pending++;
      var settled = false;
      function done(){ if(settled) return; settled = true; pending--; reveal(); }
      im.addEventListener('load', done);
      im.addEventListener('error', function(){
        if(im.src.indexOf('.webp') > -1){ im.src = im.dataset.jpg; return; }  // retry as jpeg
        done();                                                               // gave up
      });
      im.addEventListener('click', function(){ openLB(im); });
      return im;
    }

    var frame = document.createElement('div');
    frame.className = 'frame';
    var bar = null;
    if(p.split && p.audio){
      /* page image cut at a blank strip; the player is set into the seam */
      bar = makeBar(p.audio);
      frame.appendChild(mkImg(p.split.a, 1080, p.split.ah));
      frame.appendChild(bar);
      frame.appendChild(mkImg(p.split.b, 1080, p.split.bh));
    } else {
      frame.appendChild(mkImg('p'+pad, 1080, 1527));
    }

    /* QR codes and contact lines you can just tap — you cannot scan your own screen */
    if(p.links){
      p.links.forEach(function(L){
        var a = document.createElement('a');
        a.className = 'hot';
        a.href = L.href;
        a.setAttribute('aria-label', L.label);
        if(L.href.indexOf('http') === 0){ a.target = '_blank'; a.rel = 'noopener'; }
        a.style.left = L.x; a.style.top = L.y; a.style.width = L.w; a.style.height = L.h;
        frame.appendChild(a);
      });
    }

    stage.appendChild(frame);
    sec.appendChild(stage);
    frames.push({stage:stage, frame:frame, bar:bar});

    var hint = document.createElement('p');
    hint.className = 'zoomhint';
    hint.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8v6M8 11h6"/></svg> Page ' + p.n + ' / ' + N +
      (p.links ? ' — tap the QR codes to open them' : ' — tap to enlarge');
    sec.appendChild(hint);

    deck.appendChild(sec);
    secs.push(sec);

    var d = document.createElement('i');
    if(p.audio) d.className = 'tune';
    dots.appendChild(d);

    var li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = '<span class="num">' + pad + '</span><span>' + p.nav + '</span>' +
                  (p.audio ? '<span class="note">&#9834;</span>' : '');
    b.addEventListener('click', function(){ go(i); closeTOC(); });
    li.appendChild(b); tocList.appendChild(li);
  });

  var dotEls = dots.querySelectorAll('i');
  var tocEls = tocList.querySelectorAll('button');

  /* Work out each frame's width so the whole page is visible, with room for the
     player bar where there is one. Runs on layout only — never on play. */
  function sizeFrames(){
    /* Guard: while the tab is hidden or mid-restore the stage can measure 0 or
       near-0. Sizing from that would leave every page a sliver wide. */
    if(deck.clientWidth < 80) return;
    frames.forEach(function(f){
      var availH = f.stage.clientHeight, availW = f.stage.clientWidth;
      if(availH < 120 || availW < 80) return;
      var barH = f.bar ? (f.bar.offsetHeight || 60) : 0;
      var w = Math.min(availW, (availH - barH) * (PW/PH));
      f.frame.style.width = Math.max(0, Math.floor(w)) + 'px';
    });
  }

  /* Re-fit without moving off the current page. Needed whenever the viewport
     changes shape — rotation, and coming back from an external link, where the
     browser's toolbars often return at a different height. */
  function refit(){
    deck.style.scrollBehavior = 'auto';
    deck.scrollLeft = cur * deck.clientWidth;
    deck.style.scrollBehavior = '';
    sizeFrames();
  }

  function loadPage(k){
    if(k < 0 || k >= N) return false;
    var ims = secs[k].querySelectorAll('.stage img'), started = false;
    for(var j=0;j<ims.length;j++){
      if(!ims[j].src){ ims[j].src = ims[j].dataset.src; started = true; }
    }
    return started;
  }
  /* keep two pages either side ready, so turning a page never shows a half-built
     one — the split pages in particular must arrive complete, bar and all */
  function loadImgs(i){ for(var k = i-2; k <= i+2; k++) loadPage(k); }

  /* then quietly pull in the rest, one at a time so it never hogs the connection */
  function preloadRest(){
    for(var k=0;k<N;k++){ if(loadPage(k)){ setTimeout(preloadRest, 350); return; } }
  }

  function setCur(i){
    cur = i;
    for(var k=0;k<N;k++){
      dotEls[k].classList.toggle('on', k===i);
      tocEls[k].classList.toggle('on', k===i);
    }
    crumb.textContent = P[i].title + ' · ' + (i+1) + '/' + N;
    prev.disabled = i === 0;
    next.disabled = i === N-1;
    loadImgs(i);
    /* deliberately does NOT write the page number into the URL — otherwise the
       link people scan would reopen on whatever page was last viewed */
  }
  function go(i){
    i = Math.max(0, Math.min(N-1, i));
    deck.scrollTo({ left: i * deck.clientWidth, behavior:'smooth' });
    setCur(i);
  }

  var tick;
  deck.addEventListener('scroll', function(){
    clearTimeout(tick);
    tick = setTimeout(function(){ setCur(Math.round(deck.scrollLeft / deck.clientWidth)); }, 60);
  }, {passive:true});

  prev.addEventListener('click', function(){ go(cur-1); });
  next.addEventListener('click', function(){ go(cur+1); });

  document.getElementById('tocBtn').addEventListener('click', function(){
    toc.classList.add('open'); toc.setAttribute('aria-hidden','false');
  });
  function closeTOC(){ toc.classList.remove('open'); toc.setAttribute('aria-hidden','true'); }
  toc.addEventListener('click', function(e){ if(e.target === toc) closeTOC(); });

  /* lightbox */
  var tipT;
  function openLB(img){
    lbImg.src = img.dataset.big;
    lbImg.onerror = function(){ lbImg.src = img.dataset.src; };
    lb.classList.add('open'); lb.classList.remove('big');
    lb.setAttribute('aria-hidden','false');
    lb.scrollTop = 0; lb.scrollLeft = 0;
    lbTip.style.display = 'block';
    clearTimeout(tipT); tipT = setTimeout(function(){ lbTip.style.display='none'; }, 2600);
  }
  function closeLB(){
    lb.classList.remove('open','big'); lb.setAttribute('aria-hidden','true'); lbImg.src='';
  }
  document.getElementById('lbClose').addEventListener('click', closeLB);
  lbImg.addEventListener('click', function(){
    var was = lb.classList.contains('big');
    var ratio = lb.scrollTop / Math.max(1, lb.scrollHeight);
    lb.classList.toggle('big');
    raf(function(){
      lb.scrollTop = ratio * lb.scrollHeight;
      if(!was) lb.scrollLeft = (lb.scrollWidth - lb.clientWidth) / 2;
    });
  });

  document.addEventListener('keydown', function(e){
    if(lb.classList.contains('open')){ if(e.key === 'Escape') closeLB(); return; }
    if(toc.classList.contains('open')){ if(e.key === 'Escape') closeTOC(); return; }
    if(e.key === 'ArrowRight') go(cur+1);
    else if(e.key === 'ArrowLeft') go(cur-1);
    else if(e.key === 'Home') go(0);
    else if(e.key === 'End') go(N-1);
  });

  var rz;
  function refitSoon(delay){ clearTimeout(rz); rz = setTimeout(refit, delay || 120); }

  window.addEventListener('resize', function(){ refitSoon(120); });
  window.addEventListener('orientationchange', function(){ setTimeout(refit, 260); });

  /* Coming back from the feedback form / Instagram on a phone: the browser
     restores the page but its toolbars often return at a different height, so
     every frame has to be measured again. Several signals, because which ones
     fire depends on the browser — refit is cheap and idempotent. */
  window.addEventListener('pageshow', function(){ refit(); setTimeout(refit, 60); setTimeout(refit, 300); });
  window.addEventListener('focus', function(){ refitSoon(60); });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){ refit(); setTimeout(refit, 120); setTimeout(refit, 400); }
  });
  if(window.ResizeObserver){
    new ResizeObserver(function(){ refitSoon(80); }).observe(deck);
  }
  /* iOS toolbars slide away as you scroll, changing the visual viewport height */
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){ refitSoon(150); });
  }

  /* ALWAYS open on page 1 — no exceptions.
     Three things used to defeat this: a #pN left in the URL, the browser
     restoring the deck's scroll position, and a stale bookmark. All handled. */
  try{ if('scrollRestoration' in history) history.scrollRestoration = 'manual'; }catch(e){}
  try{
    if(location.hash) history.replaceState(null, '', location.pathname + location.search);
  }catch(e){}

  function goHome(){
    deck.style.scrollBehavior = 'auto';
    deck.scrollLeft = 0;                    // beats browser scroll restoration
    deck.style.scrollBehavior = '';
    setCur(0);
    sizeFrames();
  }
  goHome();
  raf(goHome);
  window.addEventListener('load', function(){
    goHome();
    setTimeout(goHome, 100);
    setTimeout(goHome, 400);                // late pass: Safari restores scroll last
  });
  /* note: a bfcache restore (coming back from the feedback form) deliberately
     does NOT go home — you should land back on the page you left from. That is
     handled by the pageshow refit above. */
  (window.requestIdleCallback || setTimeout)(function(){ preloadRest(); sizeFrames(); }, 1200);
})();
</script>
</body>
</html>
